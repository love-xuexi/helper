<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答助手</title>
    <link rel="stylesheet" href="/static/styles.css?v=7">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="sidebar-title">智能问答助手</h2>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>

                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-footer-btn" id="kbManageBtn" title="知识库管理">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20V22H6.5A2.5 2.5 0 0 1 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>知识库</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 顶部工具栏 -->
            <div class="chat-toolbar">
                <div class="chat-toolbar-title">智能问答助手</div>
                <div class="chat-toolbar-actions">
                    <button class="toolbar-btn" id="toolbarBugBtn" title="上报Bug">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2L9.5 4.5M16 2L14.5 4.5M5 8L3 8M21 8L19 8M6 16L4 17M18 16L20 17M9 10V9M15 10V9M12 19C8.5 19 6 16.5 6 13V11C6 7.5 8.5 5 12 5C15.5 5 18 7.5 18 11V13C18 16.5 15.5 19 12 19ZM10 13C10 13.5 10.5 14 11 14H13C13.5 14 14 13.5 14 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>上报Bug</span>
                    </button>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- 欢迎界面（放在 chat-messages 内部，随消息滚动） -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">智能问答助手</h1>
                        <p class="welcome-subtitle">基于知识库的智能问答，回答附带引用来源</p>
                        <div class="welcome-suggestions">
                            <div class="suggestion-card" data-question="寿险投保规则是什么？">
                                <div class="suggestion-icon">📋</div>
                                <div class="suggestion-text">寿险投保规则</div>
                            </div>
                            <div class="suggestion-card" data-question="体检标准有哪些？">
                                <div class="suggestion-icon">🏥</div>
                                <div class="suggestion-text">体检标准说明</div>
                            </div>
                            <div class="suggestion-card" data-question="残疾人员投保有什么限制？">
                                <div class="suggestion-icon">📋</div>
                                <div class="suggestion-text">残疾人员投保</div>
                            </div>
                            <div class="suggestion-card" data-question="人身险保额财务及契约调查规则">
                                <div class="suggestion-icon">💰</div>
                                <div class="suggestion-text">保额调查规则</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="输入您的问题..." maxlength="2000" class="message-input" rows="1"></textarea>
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <svg class="tools-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                                        </svg>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>上传文档到知识库</span>
                                        </div>
                                        <div class="tools-menu-item" id="kbManageMenuItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20V22H6.5A2.5 2.5 0 0 1 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>知识库管理</span>
                                        </div>
                                        <div class="tools-menu-item" id="bugReportMenuItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M8 2L9.5 4.5M16 2L14.5 4.5M5 8L3 8M21 8L19 8M6 16L4 17M18 16L20 17M9 10V9M15 10V9M12 19C8.5 19 6 16.5 6 13V11C6 7.5 8.5 5 12 5C15.5 5 18 7.5 18 11V13C18 16.5 15.5 19 12 19ZM10 13C10 13.5 10.5 14 11 14H13C13.5 14 14 13.5 14 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>上报Bug</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <button class="stop-btn" id="stopButton" title="停止生成" style="display: none;">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                                        </svg>
                                    </button>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.png,.jpg,.jpeg" style="display: none;">
                </div>
            </div>
        </main>

        <!-- 右侧引用来源侧边栏 -->
        <aside class="references-sidebar" id="referencesSidebar">
            <div class="references-header">
                <div class="references-header-top">
                    <div class="references-header-title">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 18V5L21 3V16M9 18C9 19.6569 7.65685 21 6 21C4.34315 21 3 19.6569 3 18C3 16.3431 4.34315 15 6 15C7.65685 15 9 16.3431 9 18ZM21 13C21 14.6569 19.6569 16 18 16C16.3431 16 15 14.6569 15 13C15 11.3431 16.3431 10 18 10C19.6569 10 21 11.3431 21 13Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>引用来源</span>
                    </div>
                    <button class="references-close-btn" id="referencesCloseBtn" title="关闭">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div class="references-subtitle" id="referencesCount"></div>
            </div>
            <div class="references-list" id="referencesList">
            </div>
        </aside>
    </div>

    <!-- 反馈弹窗 -->
    <div class="modal-overlay" id="feedbackModal" style="display: none;">
        <div class="modal-content feedback-modal">
            <div class="modal-header">
                <h3 class="modal-title">帮助我们改进</h3>
                <button class="modal-close" id="feedbackModalClose">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="feedback-question">请告诉我们哪里做得不好：</p>
                <div class="feedback-tags" id="feedbackTagsContainer">
                    <!-- 标签将动态生成 -->
                </div>
                <div class="feedback-textarea-wrapper">
                    <textarea id="feedbackDescription" class="feedback-textarea" placeholder="补充详细描述（可选）..." rows="4" maxlength="1000"></textarea>
                    <div class="char-count" id="charCount">0/1000</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="feedbackCancelBtn">取消</button>
                <button class="btn btn-primary" id="feedbackSubmitBtn">提交反馈</button>
            </div>
        </div>
    </div>

    <!-- 知识库管理弹窗 -->
    <div class="modal-overlay" id="kbModal" style="display: none;">
        <div class="modal-content kb-modal">
            <div class="modal-header">
                <h3 class="modal-title">知识库管理</h3>
                <button class="modal-close" id="kbModalClose">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="kb-upload-section">
                    <h4>上传文档</h4>
                    <div class="kb-select-wrapper">
                        <label>选择知识库：</label>
                        <select id="kbSelect" class="kb-select">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="kbUploadBtn">选择文件上传</button>
                </div>
                <div class="kb-list-section">
                    <h4>知识库列表</h4>
                    <div class="kb-list" id="kbListContainer">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bug上报弹窗 -->
    <div class="modal-overlay" id="bugModal" style="display: none;">
        <div class="modal-content bug-modal">
            <div class="modal-header">
                <h3 class="modal-title">🐞 上报Bug</h3>
                <button class="modal-close" id="bugModalClose">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="bug-form">
                    <div class="bug-form-field">
                        <label>分类 <span style="color:#ea4335;">*</span></label>
                        <select id="bugCategory" class="kb-select">
                            <option value="检索问题">检索问题</option>
                            <option value="生成问题">生成问题</option>
                            <option value="模型配置问题">模型配置问题</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="bug-form-field">
                        <label>标题 <span style="color:#ea4335;">*</span></label>
                        <input type="text" id="bugTitle" placeholder="简要描述Bug标题" maxlength="100" style="width:100%;padding:8px 14px;border:1px solid #d1d1d1;border-radius:10px;font-size:14px;">
                    </div>
                    <div class="bug-form-field">
                        <label>详细描述 <span style="color:#ea4335;">*</span></label>
                        <textarea id="bugContent" placeholder="请详细描述Bug发生的情况..." rows="5" maxlength="2000" style="width:100%;padding:10px 14px;border:1px solid #d1d1d1;border-radius:10px;font-size:14px;resize:vertical;"></textarea>
                    </div>
                    <div class="bug-form-field">
                        <label>附件（可选）</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <button class="btn btn-secondary" id="bugAttachmentBtn" type="button">选择文件</button>
                            <span id="bugAttachmentName" style="font-size:13px;color:#888;">未选择文件</span>
                        </div>
                        <input type="file" id="bugFileInput" accept=".png,.jpg,.jpeg,.gif,.bmp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.log,.zip,.json" style="display:none;">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="bugCancelBtn">取消</button>
                <button class="btn btn-primary" id="bugSubmitBtn">提交Bug</button>
            </div>
        </div>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在处理...</div>
            <div class="loading-subtext">请稍候</div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
